name: build-mobile-image

on:
  push:
    branches:
      - custom/mobile-orders
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck and build mobile
        working-directory: frontend/packages/mobile
        run: |
          node tests/order-create.cjs
          pnpm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish mobile-only overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/Dockerfile.mobile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stephenkingjjy/cordys-crm:mobile-orders-${{ github.sha }}
