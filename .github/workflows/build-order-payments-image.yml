name: build-order-payments-image

on:
  push:
    branches:
      - custom/order-payments
      - custom/order-payment-export
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/stephenkingjjy/cordys-crm

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare isolated test storage
        run: |
          sudo mkdir -p /opt/cordys/data/files /opt/cordys/logs/cordys-crm
          sudo chown -R "$USER" /opt/cordys
      - name: Backend regression tests
        run: ./mvnw -f backend/pom.xml -pl crm -am test -DskipAntRunForJenkins

  build-and-push:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CRM_VERSION=order-payments-${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:order-payments-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
