name: build-custom-image

on:
  push:
    branches:
      - custom/virtual-phone
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/stephenkingjjy/cordys-crm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CRM_VERSION=virtual-phone-${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:virtual-phone
            ${{ env.IMAGE_NAME }}:virtual-phone-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
